# Placement Tracker — NGINX reverse proxy (Docker).
# Same routing as the Windows nginx/conf/nginx.conf, but upstreams use Docker
# Compose service names (frontend, backend) instead of 127.0.0.1/localhost,
# which would point at the NGINX container itself.
#
# Single public entry point:  http://localhost:8080
#   /        -> Vue frontend container      (http://frontend:5173)
#   /api/... -> ASP.NET Core API container  (http://backend:8080)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;

    # --- ASP.NET Core Web API -------------------------------------------------
    # URI is forwarded unchanged: /api/applications -> /api/applications.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Vue 3 frontend -------------------------------------------------------
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
