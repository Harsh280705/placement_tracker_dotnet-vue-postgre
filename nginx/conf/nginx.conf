# Placement Tracker — NGINX reverse proxy (Windows, project-local).
#
# Single public entry point:  http://localhost:8080
#   /        -> Vue 3 + Vite dev server  (http://127.0.0.1:5173)
#   /api/... -> ASP.NET Core Web API     (http://127.0.0.1:5038)
# PostgreSQL (:5432) is NOT exposed through NGINX.
#
# Start (from the nginx/ folder):  .\nginx.exe
# Stop  (from the nginx/ folder):  .\nginx.exe -s stop
# Test config:                      .\nginx.exe -t

worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Lets NGINX forward Vite's WebSocket (HMR) handshake only when the
    # client actually asks to upgrade; plain HTTP requests are unaffected.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name localhost;

        # --- ASP.NET Core Web API -------------------------------------------------
        # URI is forwarded unchanged: /api/applications -> /api/applications.
        location /api/ {
            proxy_pass http://127.0.0.1:5038;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Vue 3 + Vite dev server ----------------------------------------------
        # Vite serves index.html for unknown routes itself (SPA fallback), so a
        # plain proxy_pass is enough here; Dashboard/Add/Details/Edit survive a
        # browser refresh. Upgrade/Connection headers keep Vite HMR working.
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
